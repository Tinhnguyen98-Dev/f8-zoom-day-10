<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CUSTOM CHECKBOX</title>

        <link rel="stylesheet" href="./css/reset.css" />
        <link rel="stylesheet" href="./css/custom-checkbox.css" />
    </head>
    <body>
        <div class="toggle">
            <!-- Checkbox -->
            <div class="toggle-checkbox">
                <label for="">Checkbox</label>
                <input
                    type="checkbox"
                    id="check-box"
                    class="input-checkbox"
                    hidden
                />
                <label for="check-box" class="check-box"></label>
            </div>

            <!-- Radio -->
            <div class="toggle-radio">
                <label for="">Radio</label>
                <input type="checkbox" id="radio" class="input-radio" hidden />
                <label for="radio" class="radio"></label>
            </div>

            <!-- Switch -->
            <div class="toggle-switch">
                <label for="">Switch</label>
                <input type="checkbox" id="switch-input" hidden />
                <label for="switch-input" class="switch-label"> </label>
                <label for="switch-input" class="switch-button"></label>
            </div>
        </div>
    </body>
</html>
